[project]
name = "ff"
version = "0.1.0"
description = "Builds the static data for the Fantabolti fantasy football dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.4",
    "requests>=2.32.5",
    "types-requests>=2.32.4.20250913",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Only ff/ is Python; the rest of the repository (web/, worker/, data/, ...) is not part of the package
[tool.setuptools]
packages = ["ff", "ff.service"]

[tool.pyright]
venvPath = "."
venv = ".venv"
