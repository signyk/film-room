name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # Sleeper asks that the 16 MB player list is fetched at most once a day: injuries and team
  # changes reach the dashboard with this daily rebuild. Weekly stats are live through the Worker.
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build data
        run: uv run python -m ff.build_data

      - run: npm test

      - run: npm run build

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy --config dist/fantabolti/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
